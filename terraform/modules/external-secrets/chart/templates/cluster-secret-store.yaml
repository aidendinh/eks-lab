apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStoreName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      # No auth block: credentials come from the EKS Pod Identity association
      # attached to the operator's service account, so there is no key to store
      # and nothing to rotate.
