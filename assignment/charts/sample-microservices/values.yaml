# Defaults applied to every service. Individual services below may override
# image, resources, probes, placement and metrics scraping.
image:
  repository: 600627340244.dkr.ecr.ap-southeast-1.amazonaws.com/eks-lab
  tag: "0.1.0"
  pullPolicy: IfNotPresent

clusterName: eks-workload
otlpTracesEndpoint: http://alloy.monitoring.svc.cluster.local:4318/v1/traces

serviceAccount:
  create: true
  name: sample-microservices

# Each service targets a different Karpenter NodePool, so all three pools carry
# real workload rather than existing only on paper:
#
#   frontend   -> pool 1  general-spot-amd64   Spot, amd64, <= t3.medium
#   payments   -> pool 1  general-spot-amd64   Spot, amd64, <= t3.medium
#   inventory  -> pool 2  graviton-arm64       Graviton, arm64, <= t4g.medium
#   orders     -> pool 3  microservices-*      On-Demand + Spot at 1:3
#
# Three of the four are JVM services (orders, inventory, payments), all
# instrumented with JavaMelody and all reporting into the collector. frontend
# stays Python because it is the KEDA-scaled entry point and its
# `sample_requests_total` counter is what the ScaledObject's PromQL queries.
services:
  frontend:
    replicaCount: 2
    downstreamUrls:
      - http://orders:8080/work
      - http://inventory:8080/work
      - http://payments:8080/work
    nodeSelector:
      workload-tier: general
      kubernetes.io/arch: amd64
    # Pool 1 is untainted, so no toleration is needed.
    tolerations: []
    # KEDA drives this one: it is the entry point, so its load is the load.
    # maxReplicas is bounded by pool 1's vCPU ceiling: anti-affinity gives every
    # replica its own node, so 4 replicas need 4 nodes = 8 vCPU of t3.medium.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  # A JVM on Graviton. Same Java image as `orders` — the app is entirely
  # env-driven, so a second service needs no second codebase — and the image is
  # a multi-arch manifest, so this tag resolves to its arm64 child here and its
  # amd64 child on the other pools. Proves the JVM runs on both architectures.
  inventory:
    replicaCount: 2
    downstreamUrls: []
    image:
      tag: "orders-java-0.1.0"
    nodeSelector:
      workload-tier: graviton
      kubernetes.io/arch: arm64
    tolerations: []
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 768Mi
    startupProbe:
      enabled: true
      failureThreshold: 30
      periodSeconds: 5
    metrics:
      path: /monitoring
      params:
        format:
          - prometheus
      normalizeDotsInMetricNames: true
    javamelody:
      enabled: true
      applicationName: inventory
      collectorUrlSecret: javamelody-collector-url

  # Third JVM service, on the Spot amd64 pool. Exists so the JavaMelody
  # collector has more than one application to aggregate and the "all Java apps"
  # requirement is demonstrated across architectures and pools.
  payments:
    replicaCount: 2
    downstreamUrls: []
    image:
      tag: "orders-java-0.1.0"
    nodeSelector:
      workload-tier: general
      kubernetes.io/arch: amd64
    tolerations: []
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 768Mi
    startupProbe:
      enabled: true
      failureThreshold: 30
      periodSeconds: 5
    metrics:
      path: /monitoring
      params:
        format:
          - prometheus
      normalizeDotsInMetricNames: true
    javamelody:
      enabled: true
      applicationName: payments
      collectorUrlSecret: javamelody-collector-url

  # The Java service. Same HTTP contract as the Python ones, but a JVM with
  # JavaMelody attached, so it needs a different image, more memory, a longer
  # startup allowance and a different metrics endpoint.
  orders:
    replicaCount: 4
    downstreamUrls: []
    image:
      tag: "orders-java-0.1.0"
    # Pool 3, the mixed pool, and pinned to amd64. Four replicas that cannot
    # share a node force Karpenter to launch four; the Spot NodePool's vCPU
    # ceiling covers three of them, so the fourth can only be satisfied
    # On-Demand. That is where the 1:3 ratio comes from — it is a consequence of
    # this manifest, not a fleet written down in the NodePool.
    nodeSelector:
      workload-tier: mixed
      kubernetes.io/arch: amd64
    tolerations:
      - key: dedicated
        operator: Equal
        value: microservices
        effect: NoSchedule
    topologySpread:
      hostnameMinDomains: 4
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 768Mi
    # A JVM takes far longer to become ready than the Python services. Without
    # a startupProbe the default liveness settings (initialDelay 5s, period 10s,
    # threshold 3) would kill the container at roughly 35 seconds, producing a
    # CrashLoopBackOff that looks like an application bug.
    startupProbe:
      enabled: true
      failureThreshold: 30
      periodSeconds: 5
    # JavaMelody exposes Prometheus metrics on its own endpoint rather than
    # /metrics: GET /monitoring?format=prometheus
    metrics:
      path: /monitoring
      params:
        format:
          - prometheus
      # JavaMelody emits metric names containing dots. Prometheus 3.x accepts
      # them, but every PromQL query then needs the quoted-name syntax
      # {"javamelody.used_memory_sys"}. Rewriting dots to underscores at scrape
      # time keeps queries conventional. Set to false if you would rather see
      # the raw names.
      normalizeDotsInMetricNames: true
    javamelody:
      enabled: true
      applicationName: orders
      # The collector enforces Basic auth, so the URL (with credentials as
      # userinfo) comes from this ESO-synced secret rather than from values.
      # Setting collectorUrl instead (and no secret) works for an
      # unauthenticated collector; empty disables self-registration entirely.
      collectorUrlSecret: javamelody-collector-url

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Overridden per service above; nothing should land on an unintended pool.
nodeSelector: {}
tolerations: []

# maxSkew bounds the difference between domains; it does not by itself stop two
# replicas sharing a node. Pod anti-affinity below closes that gap.
topologySpreadConstraints:
  zone:
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  hostname:
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule

# `required` is safe here because every pool has vCPU headroom for one replica
# per node at the replica counts above. Drop to `preferred` if you raise replica
# counts past what a pool's cpu limit can hold, or pods will sit Pending.
podAntiAffinity:
  enabled: true
  type: required

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# A single ReadWriteMany claim, shared by all three Deployments across nodes and
# availability zones. Dynamically provisioned: the EFS CSI driver creates an
# access point on the shared filesystem when the claim is made. EBS could not
# back this — it is zonal and ReadWriteOnce.
persistence:
  enabled: true
  storageClassName: efs-rwx
  accessModes:
    - ReadWriteMany
  size: 1Gi

# KEDA, not a stock HPA: the trigger is a PromQL query against the workload
# cluster's Prometheus, which a plain HPA cannot read without a custom metrics
# adapter. KEDA adds pods; the Pending pods that result are what Karpenter
# scales nodes against.
autoscaling:
  pollingInterval: 15
  cooldownPeriod: 120
  # kube-prometheus-stack truncates its generated Service name, so this is
  # `<release>-kube-p-prometheus`, not `<release>-kube-prometheus-prometheus`.
  # Getting it wrong leaves the ScaledObject Ready=False with the unhelpful
  # message "Triggers defined in ScaledObject are not working correctly".
  prometheusAddress: http://workload-monitoring-kube-p-prometheus.monitoring.svc.cluster.local:9090
  # Requests per second per replica before KEDA adds another.
  targetRequestsPerSecond: "5"

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: workload-monitoring
