{{- $root := . -}}
{{- range $name, $settings := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sample-microservices.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name | quote }}
spec:
  {{- if not (dig "autoscaling" "enabled" false $settings) }}
  replicas: {{ $settings.replicaCount }}
  {{- else }}
  # Deliberately omitted when KEDA owns this Deployment. Argo CD syncs with
  # selfHeal, so a replicas value in Git would be treated as desired state and
  # reverted the moment KEDA scaled away from it — the two would fight every
  # reconcile and the autoscaling would never visibly hold.
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge zero, not one. Anti-affinity gives every replica its own node, so
      # a surge pod needs a *spare* node in the pool — and the pools are capped
      # on purpose (pool 3's ceiling is exactly the four nodes that produce the
      # 1:3 ratio). With maxSurge 1 the extra pod has nowhere to go and the
      # rollout deadlocks on a Pending pod. Trading it for maxUnavailable 1
      # means one replica is briefly down during an update, which is what the
      # PodDisruptionBudget already allows.
      maxSurge: 0
      maxUnavailable: {{ $root.Values.podDisruptionBudget.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $root.Chart.Name | quote }}
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/component: {{ $name | quote }}
  template:
    metadata:
      labels:
        {{- include "sample-microservices.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ dig "metrics" "path" "/metrics" $settings | quote }}
        prometheus.io/port: {{ $root.Values.service.port | quote }}
    spec:
      serviceAccountName: {{ include "sample-microservices.serviceAccountName" $root }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- toYaml (mergeOverwrite (deepCopy $root.Values.nodeSelector) (dig "nodeSelector" (dict) $settings)) | nindent 8 }}
      {{- $tolerations := dig "tolerations" $root.Values.tolerations $settings }}
      {{- if $tolerations }}
      tolerations:
        {{- toYaml $tolerations | nindent 8 }}
      {{- end }}
      {{- $antiAffinity := dig "podAntiAffinity" (dict) $settings | default $root.Values.podAntiAffinity }}
      {{- if $antiAffinity.enabled }}
      # Anti-affinity and the hostname spread constraint below do related but
      # distinct jobs. maxSkew only bounds the *difference* between nodes, so
      # with few nodes two replicas may still share one. This forbids that
      # outright: no two replicas of a service on the same node, ever.
      affinity:
        podAntiAffinity:
          {{- if eq $antiAffinity.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ $root.Chart.Name | quote }}
                  app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
                  app.kubernetes.io/component: {{ $name | quote }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $root.Chart.Name | quote }}
                    app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
                    app.kubernetes.io/component: {{ $name | quote }}
          {{- end }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: {{ $root.Values.topologySpreadConstraints.zone.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ $root.Values.topologySpreadConstraints.zone.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $root.Chart.Name | quote }}
              app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
              app.kubernetes.io/component: {{ $name | quote }}
        - maxSkew: {{ $root.Values.topologySpreadConstraints.hostname.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ $root.Values.topologySpreadConstraints.hostname.whenUnsatisfiable }}
          {{- $minDomains := dig "topologySpread" "hostnameMinDomains" 0 $settings }}
          {{- if gt (int $minDomains) 0 }}
          # With few eligible nodes the skew check passes trivially (one domain
          # = skew 0) and every replica packs onto one node. minDomains keeps
          # the global minimum at 0 until this many domains exist, forcing
          # Pending pods that Karpenter answers with new nodes.
          minDomains: {{ $minDomains }}
          {{- end }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $root.Chart.Name | quote }}
              app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
              app.kubernetes.io/component: {{ $name | quote }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" (dig "image" "repository" $root.Values.image.repository $settings) (dig "image" "tag" $root.Values.image.tag $settings) | quote }}
          imagePullPolicy: {{ dig "image" "pullPolicy" $root.Values.image.pullPolicy $settings }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SERVICE_NAME
              value: {{ $name | quote }}
            - name: CLUSTER_NAME
              value: {{ $root.Values.clusterName | quote }}
            - name: PORT
              value: {{ $root.Values.service.port | quote }}
            - name: DATA_DIR
              value: /data
            - name: DOWNSTREAM_URLS
              value: {{ join "," (default (list) $settings.downstreamUrls) | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ $root.Values.otlpTracesEndpoint | quote }}
            {{- if dig "javamelody" "enabled" false $settings }}
            # The pod tells the collector server where to poll it. Pod IPs are
            # assigned at schedule time, so this cannot be a static value.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JAVAMELODY_APPLICATION_NAME
              value: {{ dig "javamelody" "applicationName" $name $settings | quote }}
            {{- if dig "javamelody" "collectorUrlSecret" "" $settings }}
            # The collector requires Basic auth; the URL carries user:password
            # as userinfo (JavaMelody's LabradorRetriever turns it into an
            # Authorization header), so it lives in a secret, not in values.
            - name: JAVAMELODY_COLLECTOR_URL
              valueFrom:
                secretKeyRef:
                  name: {{ dig "javamelody" "collectorUrlSecret" "" $settings }}
                  key: JAVAMELODY_COLLECTOR_URL
            {{- else }}
            - name: JAVAMELODY_COLLECTOR_URL
              value: {{ dig "javamelody" "collectorUrl" "" $settings | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $root.Values.service.port }}
              protocol: TCP
          {{- if dig "startupProbe" "enabled" false $settings }}
          # A JVM needs far longer to boot than the Python services. The
          # startupProbe suspends the liveness probe until the app answers, so a
          # slow start is not mistaken for a hung container.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: {{ dig "startupProbe" "failureThreshold" 30 $settings }}
            periodSeconds: {{ dig "startupProbe" "periodSeconds" 5 $settings }}
            timeoutSeconds: 3
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          resources:
            {{- toYaml (dig "resources" $root.Values.resources $settings) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if $root.Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: sample-microservices-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
