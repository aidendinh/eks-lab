# JavaMelody collector server for eks-workload.
#
# Why this exists: JavaMelody's counters live inside each JVM, so four `orders`
# replicas expose four unrelated /monitoring UIs. The collector polls every
# registered node and presents one aggregated view of the application.
#
# It is platform tooling rather than application workload, so it is installed
# with kubectl onto the tainted platform nodes — the same way Prometheus, Alloy
# and Argo CD are — instead of being deployed by Argo CD alongside the sample
# chart.
#
# Replace <ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/eks-lab-sample below if your
# registry differs.
apiVersion: v1
kind: Service
metadata:
  name: javamelody-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: javamelody-collector
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: javamelody-collector
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: javamelody-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: javamelody-collector
spec:
  # Must stay at 1. The collector aggregates into local RRD files; a second
  # replica would hold a different, equally partial picture — the exact problem
  # it exists to solve.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: javamelody-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: javamelody-collector
    spec:
      nodeSelector:
        workload-class: platform
      tolerations:
        - key: dedicated
          operator: Equal
          value: platform
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: 600627340244.dkr.ecr.ap-southeast-1.amazonaws.com/eks-lab-sample:javamelody-collector-2.8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Basic auth: the collector WAR only reads javamelody.* system
          # properties, so the ESO-synced env var is expanded into a -D flag by
          # a shell wrapper. Not JAVA_TOOL_OPTIONS — the JVM echoes that to
          # stderr, which would leak the password into Loki.
          command: ["sh", "-c"]
          args:
            - exec java -XX:MaxRAMPercentage=70.0
              -Djavamelody.storage-directory=/tmp/javamelody-collector
              -Djava.security.egd=file:/dev/./urandom
              "-Djavamelody.authorized-users=$JAVAMELODY_AUTHORIZED_USERS"
              -jar /app/collector-server.war
          envFrom:
            - secretRef:
                name: javamelody-auth
          # TCP probes: with javamelody.authorized-users set, HTTP probes would
          # get 401 and kill the pod.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Aggregated history is disposable in this lab. Note the consequence:
        # restarting this pod clears its registered-node list, which is why the
        # application pods re-register on a timer instead of only at startup.
        - name: tmp
          emptyDir: {}
