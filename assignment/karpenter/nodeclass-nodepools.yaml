apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: mixed
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: eks-lab-workload-node-role
  subnetSelectorTerms:
    - id: subnet-09710a86b3db80644
    - id: subnet-0d9e554fcc74dd7e2
  securityGroupSelectorTerms:
    - id: sg-01e88b1541f7415e4
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
  tags:
    Project: eks-two-cluster-assignment
    Environment: lab
    ManagedBy: Karpenter
    Owner: assignment
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: mixed-on-demand
spec:
  template:
    metadata:
      labels:
        workload-tier: mixed
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: mixed
      taints:
        - key: dedicated
          value: microservices
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3a.medium"]
  limits:
    cpu: "2"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: mixed-spot
spec:
  template:
    metadata:
      labels:
        workload-tier: mixed
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: mixed
      taints:
        - key: dedicated
          value: microservices
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3a.medium"]
  limits:
    cpu: "6"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
