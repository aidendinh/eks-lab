apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: javamelody-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: javamelody-auth
    creationPolicy: Owner
    template:
      data:
        auth.args: "-Djavamelody.authorized-users={{ .auth }}"
  data:
    - secretKey: auth
      remoteRef:
        key: eks-lab/credentials
        property: javamelody-auth
